<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A5D77">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Home Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: wall-tablet board. Sticky header (clock + tabs), then a dense two-column grid of panels
   that stacks to one column on phones. Big tap targets; night mode tints everything red for 3am feeds. */
:root{
  --bg:#EDF1F2; --surface:#FFFFFF; --surface-2:#E2E9EB; --ink:#16252A; --muted:#566A70; --line:#D2DCDF;
  --accent:#2A5D77; --accent-ink:#FFFFFF; --gorse:#D9A02A;
  --ok:#2E7A4D; --warn:#A86F12; --bad:#B03E2D;
  --ok-bg:#E1F0E6; --warn-bg:#FAEFD8; --bad-bg:#F7E2DE;
  --feed:#2A5D77; --nappy:#8A6630; --sleep:#5A4E8E; --med:#2E7A4D;
  --font-display:'Bricolage Grotesque', ui-rounded, system-ui, sans-serif;
  --font-body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --note-1:#FBEDB0; --note-2:#F7D8DF; --note-3:#D4E7F4; --note-4:#DBEFD5;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#162125; --surface-2:#1E2C30; --ink:#E2EBED; --muted:#92A6AB; --line:#29393E;
  --accent:#7CB3D0; --accent-ink:#0E1618; --gorse:#E6B74A;
  --ok:#6BBF8E; --warn:#E1A84B; --bad:#E47967;
  --ok-bg:#16301F; --warn-bg:#32280E; --bad-bg:#391C17;
  --feed:#7CB3D0; --nappy:#C9A46A; --sleep:#A99BE0; --med:#6BBF8E; color-scheme:dark;
  --note-1:#4A4120; --note-2:#4A2B34; --note-3:#21384A; --note-4:#284026;
}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#162125; --surface-2:#1E2C30; --ink:#E2EBED; --muted:#92A6AB; --line:#29393E;
  --accent:#7CB3D0; --accent-ink:#0E1618; --gorse:#E6B74A;
  --ok:#6BBF8E; --warn:#E1A84B; --bad:#E47967;
  --ok-bg:#16301F; --warn-bg:#32280E; --bad-bg:#391C17;
  --feed:#7CB3D0; --nappy:#C9A46A; --sleep:#A99BE0; --med:#6BBF8E; color-scheme:dark;
  --note-1:#4A4120; --note-2:#4A2B34; --note-3:#21384A; --note-4:#284026;
}
/* Night mode: red-only, dim. Declared last so it wins over both themes. */
:root[data-night]{
  --bg:#080303; --surface:#120707; --surface-2:#1A0B0A; --ink:#D8664C; --muted:#8C4334; --line:#2A1310;
  --accent:#C0442E; --accent-ink:#080303; --gorse:#C0442E;
  --ok:#D8664C; --warn:#D8664C; --bad:#FF7A5C;
  --ok-bg:#1F0D0B; --warn-bg:#1F0D0B; --bad-bg:#2C0F0B;
  --feed:#D8664C; --nappy:#B5513C; --sleep:#9E4634; --med:#D8664C; color-scheme:dark;
  --note-1:#1F0D0B; --note-2:#1F0D0B; --note-3:#1F0D0B; --note-4:#1F0D0B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gorse);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1280px;margin:0 auto}

/* Header */
header{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.clock{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.02em;line-height:1}
.date{font-size:1rem;color:var(--muted)}
.hspacer{flex:1}
nav.tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:999px;overflow-x:auto;max-width:100%}
nav.tabs a{padding:10px 18px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;white-space:nowrap;min-height:44px;display:flex;align-items:center}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px;min-height:44px;font-weight:700}
.iconbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Banner */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:.95rem}
.banner b{color:var(--warn)}
.banner .grow{flex:1;min-width:200px}

/* Grid + panels */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}
@media (max-width:900px){.span-8,.span-6,.span-4{grid-column:span 12}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.ptitle{display:flex;align-items:baseline;gap:10px;justify-content:space-between;flex-wrap:wrap}
.ptitle h2{font-size:1.2rem;font-weight:700}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* Status tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-top:5px solid var(--c, var(--accent));min-width:0}
.tile .big{font-family:var(--font-display);font-size:clamp(1.5rem,3.2vw,2.2rem);font-weight:700;line-height:1.05}
.tile .sub{color:var(--muted);font-size:.95rem}
.tile.live{background:color-mix(in srgb, var(--c) 12%, var(--surface))}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}

/* Big action buttons */
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:10px}
.act{min-height:72px;border-radius:12px;border:2px solid var(--c, var(--accent));background:var(--surface);color:var(--ink);font-weight:700;font-size:1.05rem;padding:8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15}
.act small{font-weight:400;color:var(--muted);font-size:.8rem}
.act.solid{background:var(--c, var(--accent));color:var(--accent-ink)}
.act.solid small{color:inherit;opacity:.85}
.act:active{transform:scale(.98)}
.group{display:flex;flex-direction:column;gap:8px}
.glabel{font-weight:700;font-size:.9rem;color:var(--c, var(--muted))}

/* Lists */
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line);min-height:52px;flex-wrap:wrap}
ul.list li:last-child{border-bottom:0}
.li-main{flex:1 1 140px;min-width:0}
.li-main .t{font-weight:700;overflow-wrap:anywhere}
.li-main .s{color:var(--muted);font-size:.9rem}
.check{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;font-weight:700;color:var(--accent-ink)}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
li.done .t{text-decoration:line-through;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);font-size:1.3rem;width:40px;height:40px;border-radius:8px;flex:none}
.x:hover{background:var(--surface-2)}
.row-end{display:flex;align-items:center;gap:8px;margin-left:auto}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c)}
.small-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-weight:700;min-height:40px;flex:none}

.pill{display:inline-block;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}

/* Forms */
form.inline{display:flex;gap:8px;flex-wrap:wrap}
form.inline input,form.inline select{flex:1 1 140px;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px 12px}
form.inline input.narrow{flex:0 1 110px}
form.inline button{min-height:46px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:8px 16px}
details.add summary{cursor:pointer;color:var(--accent);font-weight:700;padding:6px 0;list-style:none}
details.add summary::-webkit-details-marker{display:none}
details.add[open] summary{margin-bottom:8px}

/* Stats row */
.stats{display:flex;flex-wrap:wrap;gap:8px 22px}
.stat b{font-family:var(--font-display);font-size:1.5rem;display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:.85rem}

/* Bins */
.bins{display:flex;gap:10px;flex-wrap:wrap}
.bin{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--surface-2);flex:1 1 160px;min-width:0}
.bin .can{width:22px;height:28px;border-radius:4px 4px 6px 6px;background:var(--c);flex:none;position:relative}
.bin .can::before{content:"";position:absolute;left:-3px;right:-3px;top:-5px;height:5px;border-radius:3px;background:var(--c)}
.bin.soon{outline:2px solid var(--gorse)}
.bins-col{flex-direction:column}
.bins-col .bin{flex:0 0 auto}

/* Weather */
.wx-now{display:flex;gap:14px 20px;align-items:center;flex-wrap:wrap}
.wx-temp{font-family:var(--font-display);font-size:clamp(2.6rem,6vw,3.4rem);font-weight:700;line-height:1}
.wx-icon{color:var(--accent);flex:none}
.wx-meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.wx-meta .t{font-weight:700;font-size:1.1rem}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.hour{flex:0 0 62px;text-align:center;padding:8px 4px;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.9rem}
.hour .ht{color:var(--muted);font-size:.8rem}
.hour .hv{font-weight:700}
.hour .hr{font-size:.75rem;color:var(--accent)}
.hour.now{outline:2px solid var(--accent)}

/* Countdown */
.preg{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.preg-big{font-family:var(--font-display);font-size:clamp(1.8rem,3.4vw,2.4rem);font-weight:700;line-height:1.05}
.preg-bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.preg-bar span{display:block;height:100%;background:var(--sleep);border-radius:999px}
.preg-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.cd-days{font-family:var(--font-display);font-size:1.7rem;font-weight:700;line-height:1;min-width:2.2ch;text-align:right}
.cd-unit{font-size:.8rem;color:var(--muted);width:3.2em}

/* Note board */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.note{background:var(--nc);color:var(--ink);border-radius:4px 4px 16px 4px;padding:12px 12px 10px;min-height:108px;display:flex;flex-direction:column;gap:8px;transform:rotate(var(--rot,0deg));box-shadow:0 1px 3px rgba(0,0,0,.12);min-width:0}
.note .nt{flex:1;font-size:1.05rem;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap}
.note .nf{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.note .nf .x{width:32px;height:32px;margin-left:auto;font-size:1.1rem}
.swatches{display:flex;gap:6px;align-items:center}
.swatch{width:34px;height:34px;border-radius:8px;border:2px solid var(--line);background:var(--nc)}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
form.inline button.swatch{background:var(--nc);border:2px solid var(--line);padding:0;min-height:34px;width:34px;flex:none}
form.inline button.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.note-form textarea{flex:1 1 100%;font:inherit;color:inherit;min-height:60px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px 12px;resize:vertical}

/* Emergency */
.addr{font-family:var(--font-display);font-size:1.7rem;font-weight:700;letter-spacing:.06em;overflow-wrap:anywhere}
.tel{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);text-decoration:none;white-space:nowrap}
.tel.missing{color:var(--muted);font-weight:400}
.emerg{border-color:var(--bad)}

/* Dinner planner */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.week .edit-box{grid-column:1/-1;order:99}
@media (max-width:900px){.week .edit-box{order:0}}
@media (max-width:900px){.week{grid-template-columns:1fr}}
.day{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:var(--surface);text-align:left;min-height:128px;min-width:0;font:inherit;color:inherit}
@media (max-width:900px){.day{min-height:0}}
.day:hover{background:var(--surface-2)}
.day.is-today{border:2px solid var(--accent)}
.day.is-editing{background:var(--surface-2);border-color:var(--gorse)}
.day .dname{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.day.is-today .dname{color:var(--accent)}
.day .meal{font-family:var(--font-display);font-weight:700;font-size:1.05rem;line-height:1.2;overflow-wrap:anywhere}
.day.unplanned .meal{color:var(--muted);font-weight:500;font-family:var(--font-body);font-size:.95rem}
.day .dnote{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.tonight{font-family:var(--font-display);font-weight:700;font-size:clamp(1.5rem,3vw,2rem);line-height:1.1;overflow-wrap:anywhere}
.edit-box{border:2px solid var(--gorse);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.edit-box textarea{font:inherit;color:inherit;width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:8px 12px;resize:vertical}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.btn-row .small-btn{flex:0 1 auto;white-space:normal;text-align:left}
.ptitle{min-width:0}

/* Money */
.amount{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.blur{filter:blur(6px);user-select:none}

/* Chart */
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;min-width:320px;height:auto}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:transparent;border:0;color:var(--gorse);font-weight:700}
.empty{color:var(--muted);font-size:.95rem;padding:6px 0}
.hint{font-size:.85rem;color:var(--muted)}

/* Phones: compact header, tabs move to a bottom bar within thumb reach */
@media (max-width:700px){
  header{padding-block:10px 8px;margin-bottom:12px}
  .hrow{flex-wrap:nowrap;gap:10px}
  .clock{font-size:2rem}
  .date{font-size:.85rem}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;border-radius:0;justify-content:space-around;gap:0;
    background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px))}
  nav.tabs a{flex:1;justify-content:center;padding:10px 4px;font-size:.92rem}
  nav.tabs a[aria-current="page"]{background:var(--surface-2);box-shadow:none}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
  .iconbtn{padding:8px 12px;font-size:.9rem}
  .tile{padding:12px}
  .tile .big{font-size:1.4rem}
  .tile .sub{font-size:.85rem}
  .panel{padding:14px}
  .act{min-height:64px;font-size:1rem}
}
</style>
</head>
<body>


<header>
  <div class="wrap hrow">
    <div>
      <div class="clock tnum" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <div class="hspacer"></div>
    <nav class="tabs" aria-label="Sections">
      <a href="#today" data-tab="today">Today</a>
      <a href="#baby" data-tab="baby">Baby</a>
      <a href="#home" data-tab="home">Household</a>
      <a href="#money" data-tab="money">Money</a>
    </nav>
    <button class="iconbtn" id="nightBtn" aria-pressed="false" data-act="night">Night mode</button>
  </div>
</header>

<main class="wrap">
  <div id="banner"></div>
  <section id="view-today" hidden></section>
  <section id="view-baby" hidden></section>
  <section id="view-home" hidden></section>
  <section id="view-money" hidden></section>
</main>
<div id="toast" class="toast" hidden></div>

<script>
/* ---------- Data layer (local for now; swap for Supabase later) ---------- */
const KEY='homeboard.v1';
const M=60e3,H=3600e3,D=864e5;
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const now=()=>Date.now();
const pad=n=>String(n).padStart(2,'0');
const iso=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const parseDay=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).getTime()};
const startOfDay=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function addDays(t,n){const d=new Date(t);d.setDate(d.getDate()+n);return startOfDay(d.getTime())}
function nextWeekday(dow){const t=startOfDay(now());const d=new Date(t);const diff=(dow-d.getDay()+7)%7;return t+diff*D}

function defaultContacts(){return [
  {id:uid(),group:'emergency',name:'Ambulance, Garda, Fire',number:'112 or 999',note:'Give the Eircode first'},
  {id:uid(),group:'medical',name:'Westdoc out-of-hours GP',number:'0818 360 000',note:'Weeknights 6pm to 9am, weekends and bank holidays 24h'},
  {id:uid(),group:'medical',name:'Poisons Information line',number:'01 809 2166',note:'Public line'},
  {id:uid(),group:'medical',name:'Our GP',number:'',note:''},
  {id:uid(),group:'medical',name:'Pharmacy',number:'',note:''},
  {id:uid(),group:'medical',name:'Public health nurse',number:'',note:''},
  {id:uid(),group:'medical',name:'Maternity unit',number:'',note:''},
  {id:uid(),group:'pets',name:'Vet',number:'',note:''},
  {id:uid(),group:'home',name:'Electrician',number:'',note:''},
  {id:uid(),group:'home',name:'Plumber',number:'',note:''}
]}
function seed(){
  const t=now(), id=uid;
  const tue=nextWeekday(2);
  return {
    example:true,
    settings:{names:['Enda','Sabrina'],nightShift:0},
    feeds:[
      {id:id(),start:t-2.3*H,end:t-2.3*H+18*M,kind:'left'},

function ago(t){const ms=now()-t;if(ms<M)return 'just now';if(ms<D)return dur(ms)+' ago';const days=Math.floor(ms/D);return days===1?'yesterday':days+' days ago'}

function dayLabel(dayT){

  const d=new Date(dayT); const base=`${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;

function rollMonthly(dayT,months){const d=new Date(dayT);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+months);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d.getTime()}

    <details class="add"><summary>+ Add a countdown</summary><form class="inline" data-form="countdown"><input id="cdTitle" name="title" required placeholder="e.g. Baby due"><input id="cdDate" name="date" type="date" required><button>Add</button></form></details></div>`;
}
function notesPanel(){

      <select id="noteBy" name="by" aria-label="From" style="flex:0 1 140px">${names.map((n,i)=>`<option value="${i}" ${i===S.settings.lastAuthor?'selected':''}>From ${esc(n)}</option>`).join('')}</select>
      <div class="swatches" role="group" aria-label="Note colour">${[1,2,3,4].map(c=>`<button type="button" class="swatch" style="--nc:var(--note-${c})" aria-label="Colour ${c}" aria-pressed="${c===noteColor}" data-act="noteColor" data-c="${c}"></button>`).join('')}</div>
      <button>Post note</button>
    </form></div>`;
}

  const upHtml=up.filter(u=>u.t<=today+7*D).sort((a,b)=>a.t-b.t).slice(0,8).map(u=>{const st=dueStatus(u.t);return `<li><span class="dot" style="--c:${u.c}"></span><div class="li-main"><div class="t">${esc(u.title)}</div><div class="s">${u.tag}</div></div><span class="pill ${st.cls}">${u.t<today?st.txt:dayLabel(u.t)}</span></li>`}).join('')||'<li class="empty">Nothing in the next 7 days.</li>';

  const st=todayStats(); const names=S.settings.names; const ns=S.settings.nightShift;

    <div class="panel span-4">
      <div class="ptitle"><h2>Night feeds tonight</h2></div>
      <div class="actions">${names.map((n,i)=>`<button class="act ${i===ns?'solid':''}" style="--c:var(--sleep)" data-act="shift" data-i="${i}">${esc(n)}<small>${i===ns?'On tonight':'Tap to swap'}</small></button>`).join('')}</div>

    ${a.done?'':`<span class="pill ${ds.cls}">${ds.txt}</span>`}
    <button class="x" aria-label="Delete" data-act="del" data-col="appts" data-id="${a.id}">×</button></li>`}).join('')||'<li class="empty">No appointments yet.</li>';

  const qs=listItems('questions');

function lastBottleMl(){const b=lastBy(S.feeds.filter(f=>f.kind==='bottle'),'start');return b?.ml||90}

function growthChart(){
  const pts=S.growth.filter(g=>g.weightKg).map(g=>({t:parseDay(g.date),w:+g.weightKg})).sort((a,b)=>a.t-b.t);
  if(pts.length<2)return '<div class="empty">Add two weights to see the trend.</div>';
  const W=600,Hh=200,L=44,R=16,T=14,B=30;
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+D;
  let lo=Math.min(...pts.map(p=>p.w)),hi=Math.max(...pts.map(p=>p.w));
  lo=Math.floor((lo-0.1)*10)/10; hi=Math.ceil((hi+0.1)*10)/10;
  const x=t=>L+(t-t0)/(t1-t0||1)*(W-L-R), y=w=>T+(hi-w)/(hi-lo)*(Hh-T-B);
  const ticks=[lo,(lo+hi)/2,hi];
  const line=pts.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+' '+y(p.w).toFixed(1)).join(' ');
  const area=line+` L${x(pts.at(-1).t).toFixed(1)} ${Hh-B} L${x(pts[0].t).toFixed(1)} ${Hh-B} Z`;
  const last=pts.at(-1), first=pts[0];
  const fmtD=t=>{const d=new Date(t);return d.getDate()+' '+MON[d.getMonth()]};
  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Weight from ${first.w} kg to ${last.w} kg">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="14" fill="var(--muted)">${v.toFixed(1)}</text>`).join('')}
    <path d="${area}" fill="var(--feed)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--feed)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${x(p.t)}" cy="${y(p.w)}" r="3.5" fill="var(--surface)" stroke="var(--feed)" stroke-width="2"/>`).join('')}
    <circle cx="${x(last.t)}" cy="${y(last.w)}" r="6" fill="var(--feed)"/>
    <text x="${Math.min(x(last.t),W-R)-10}" y="${y(last.w)-12}" text-anchor="end" font-size="15" font-weight="700" fill="var(--ink)">${last.w.toFixed(2)} kg</text>
    <text x="${x(first.t)}" y="${Hh-8}" font-size="14" fill="var(--muted)">${fmtD(first.t)}</text>

function listItems(col,withWho){

function dinnerFor(day){return S.dinners.find(d=>d.date===day)}
function pastMeals(){const seen=new Map();S.dinners.slice().sort((a,b)=>parseDay(a.date)-parseDay(b.date)).forEach(d=>{if(d.meal)seen.set(d.meal.toLowerCase(),d)});return [...seen.values()]}
function splitIngredients(str){return String(str||'').split(/[,\n]/).map(x=>x.trim()).filter(Boolean)}
function weekDays(){const base=addDays(now(),dinnerWeek*7);return [0,1,2,3,4,5,6].map(i=>iso(addDays(base,i)))}

      <textarea id="dIng" name="ingredients" placeholder="Ingredients, separated by commas">${esc(d.ingredients||'')}</textarea>

function addToShopping(items){
  const have=new Set(S.shopping.filter(x=>!x.done).map(x=>x.text.trim().toLowerCase()));
  let n=0; items.forEach(i=>{const k=i.toLowerCase();if(!have.has(k)){have.add(k);DB.add('shopping',{text:i,done:false});n++}});
  return n;
}

/* ---------- Shell ---------- */
function renderBanner(){
  const el=document.getElementById('banner');
  el.innerHTML=S.example?`<div class="banner"><div class="grow"><b>Example data.</b> Everything here is made up so you can try the buttons. Entries save on this device only until the shared database is connected.</div><button class="small-btn" data-act="clearExample">${confirmClear?'Tap again to clear all':'Clear examples'}</button></div>`:'';
}
function render(){
  renderBanner();
  const views={today:renderToday,baby:renderBaby,home:renderHome,money:renderMoney};
  for(const k in views){const v=document.getElementById('view-'+k);v.hidden=k!==tab;}
  const v=document.getElementById('view-'+tab);
  // Preserve open <details> and focused input across re-render
  const open=[...v.querySelectorAll('details[open]')].map((d,i)=>i);
  const focusId=document.activeElement?.id;
  v.innerHTML=views[tab]();
  v.querySelectorAll('details').forEach((d,i)=>{if(open.includes(i))d.open=true});
  if(focusId){const f=document.getElementById(focusId);if(f&&v.contains(f))f.focus()}
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===tab?'page':'false'));
  if(afterRender){const f=afterRender;afterRender=null;f()}
}
function tick(){
  const d=new Date();
  document.getElementById('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());
  document.getElementById('date').textContent=d.toLocaleDateString('en-IE',{weekday:'long',day:'numeric',month:'long'});
}
function toast(msg,withUndo){
  const t=document.getElementById('toast');
  t.innerHTML=`<span>${esc(msg)}</span>${withUndo?'<button data-act="undo">Undo</button>':''}`;
  t.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.hidden=true;undo=null},5000);
}

/* ---------- Actions ---------- */
const ACT={
  night(){const on=!document.documentElement.hasAttribute('data-night');document.documentElement.toggleAttribute('data-night',on);document.getElementById('nightBtn').setAttribute('aria-pressed',on);try{localStorage.setItem(KEY+'.night',on?'1':'')}catch(e){}},
  feedStart(d){const a=activeFeed();if(a)a.end=now();DB.add('feeds',{start:now(),kind:d.kind});toast(FEEDNAME[d.kind]+' feed started')},
  feedStop(){const a=activeFeed();if(a){DB.update('feeds',a.id,{end:now()});toast('Feed logged: '+dur(a.end-a.start))}},
  feedSwitch(){const a=activeFeed();if(!a)return;DB.update('feeds',a.id,{end:now()});const k=a.kind==='left'?'right':'left';DB.add('feeds',{start:now(),kind:k});toast('Switched to '+FEEDNAME[k])},
  bottleQuick(d){const t=now();DB.add('feeds',{start:t,end:t,kind:'bottle',ml:+d.ml});toast(`Bottle logged: ${d.ml} ml`)},
  nappy(d){DB.add('nappies',{at:now(),kind:d.kind});toast('Nappy logged: '+NAPNAME[d.kind])},
  sleepStart(){DB.add('sleeps',{start:now()});toast('Sleep started')},
  sleepStop(){const s=activeSleep();if(s){DB.update('sleeps',s.id,{end:now()});toast('Sleep logged: '+dur(s.end-s.start))}},
  dose(d){const m=S.meds.find(x=>x.id===d.id);const st=medState(m);
    if(!st.ok&&earlyArmed!==m.id){earlyArmed=m.id;setTimeout(()=>{if(earlyArmed===m.id){earlyArmed=null;render()}},6000);return}
    earlyArmed=null;DB.add('doses',{medId:m.id,at:now()});toast(m.name+' dose logged')},
  del(d){const o=DB.remove(d.col,d.id);if(o){undo={col:d.col,obj:o};toast('Deleted',true)}},
  undo(){if(undo){S[undo.col].push(undo.obj);save();undo=null;document.getElementById('toast').hidden=true}},
  toggle(d){const o=S[d.col].find(x=>x.id===d.id);if(o)DB.update(d.col,d.id,{done:!o.done})},
  clearTicked(d){S[d.col]=S[d.col].filter(x=>!x.done);save();toast('Cleared')},
  remDone(d){const r=S.reminders.find(x=>x.id===d.id);if(!r)return;
    if(r.repeatDays>0){let t=Math.max(parseDay(r.due),startOfDay(now()));t+=r.repeatDays*D;DB.update('reminders',r.id,{due:iso(t)});toast(`${r.title}: next due ${dayLabel(t)}`)}
    else{const o=DB.remove('reminders',r.id);undo={col:'reminders',obj:o};toast(r.title+' done',true)}},
  dinnerEdit(d){editDay=editDay===d.day?null:d.day;if(editDay){const isNew=!dinnerFor(editDay);afterRender=()=>{const box=document.querySelector('.week .edit-box');if(!box)return;box.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});if(isNew)document.getElementById('dMeal')?.focus({preventScroll:true})}}},
  dinnerClose(){editDay=null},
  dinnerWeek(d){dinnerWeek=Math.max(0,dinnerWeek+(+d.dir));editDay=null},
  dinnerClear(d){const x=dinnerFor(d.day);if(x){const o=DB.remove('dinners',x.id);undo={col:'dinners',obj:o};toast('Cleared',true)}editDay=null},
  dinnerToShop(d){const x=dinnerFor(d.day);if(!x)return;const n=addToShopping(splitIngredients(x.ingredients));toast(n?`Added ${n} item${n===1?'':'s'} to shopping`:'Already on the list')},
  weekToShop(){const items=weekDays().map(dinnerFor).filter(Boolean).flatMap(x=>splitIngredients(x.ingredients));const n=addToShopping(items);toast(n?`Added ${n} item${n===1?'':'s'} to shopping`:'Nothing new to add')},
  planTonight(){editDay=iso(now());dinnerWeek=0;location.hash='home'},
  pregEdit(){editPreg=true},
  pregCancel(){editPreg=false},
  noteColor(d){noteColor=+d.c},
  editAddr(){editAddr=true;afterRender=()=>document.getElementById('addrInput')?.focus()},
  contactEdit(d){editContact=d.id},
  contactCancel(){editContact=null},
  shift(d){S.settings.nightShift=+d.i;save()},
  money(){moneyShown=!moneyShown},
  clearExample(){if(!confirmClear){confirmClear=true;setTimeout(()=>{confirmClear=false;renderBanner()},5000);return}confirmClear=false;S=emptyState(S);save();toast('Examples cleared')}
};
document.addEventListener('click',e=>{
  requestWake();
  const g=e.target.closest('[data-goto]'); if(g){e.preventDefault();location.hash=g.dataset.goto;return}
  const b=e.target.closest('[data-act]'); if(!b)return;
  const fn=ACT[b.dataset.act]; if(!fn)return; fn(b.dataset,b); render();
});
const FORMS={
  bottle(f){const ml=+f.ml;if(ml>0){const t=now();DB.add('feeds',{start:t,end:t,kind:'bottle',ml});toast(`Bottle logged: ${ml} ml`)}},
  med(f){DB.add('meds',{name:f.name.trim(),intervalH:+f.intervalH,note:f.note.trim()});toast('Medicine added')},
  temp(f){const c=+f.c;DB.add('temps',{at:now(),c});toast(`Temperature logged: ${c.toFixed(1)}°C`+(c>=38?'. That is high, call your GP or GP out-of-hours if worried':''))},
  growth(f){DB.add('growth',{date:f.date,weightKg:f.weightKg?+f.weightKg:null,lengthCm:f.lengthCm?+f.lengthCm:null,headCm:f.headCm?+f.headCm:null});toast('Measurement added')},
  appt(f){DB.add('appts',{title:f.title.trim(),kind:f.kind,date:f.date,time:f.time,done:false});toast('Appointment added')},
  list(f,form){const o={text:f.text.trim(),done:false};if('who' in f)o.who=f.who===''?null:+f.who;DB.add(form.dataset.col,o)},
  dinner(f){
    const meal=f.meal.trim(); let ing=f.ingredients.trim();
    if(!ing){const prev=pastMeals().find(m=>m.meal.toLowerCase()===meal.toLowerCase()&&m.date!==f.date);if(prev)ing=prev.ingredients||''}
    const ex=dinnerFor(f.date);
    if(ex)DB.update('dinners',ex.id,{meal,note:f.note.trim(),ingredients:ing});
    else DB.add('dinners',{date:f.date,meal,note:f.note.trim(),ingredients:ing});
    editDay=null; toast('Dinner saved');
  },
  preg(f){S.settings.dueDate=f.dueDate;S.settings.pregStart=f.pregStart||'';editPreg=false;save();toast('Saved')},
  note(f){const by=+f.by;S.settings.lastAuthor=by;DB.add('notes',{text:f.text.trim(),by,at:now(),color:noteColor});toast('Note posted')},
  countdown(f){DB.add('countdowns',{title:f.title.trim(),date:f.date});toast('Countdown added')},
  address(f){S.settings.address=f.address.trim().toUpperCase();editAddr=false;save()},
  contact(f,form){const o={name:f.name.trim(),number:(f.number||'').trim(),note:(f.note||'').trim()};
    if(form.dataset.id){DB.update('contacts',form.dataset.id,o);editContact=null;toast('Saved')}else{DB.add('contacts',{...o,group:f.group});toast('Contact added')}},
  rem(f){DB.add('reminders',{title:f.title.trim(),cat:f.cat,due:f.due,repeatDays:+f.repeatDays||0});toast('Reminder added')},
  bill(f){DB.add('bills',{title:f.title.trim(),cat:f.cat,due:f.due,repeat:f.repeat,amount:f.amount===''?null:+f.amount});toast('Added')}
};
document.addEventListener('submit',e=>{
  const form=e.target.closest('form[data-form]'); if(!form)return; e.preventDefault();
  const f=Object.fromEntries(new FormData(form)); FORMS[form.dataset.form](f,form);
  const keepFocus=form.dataset.form==='list'; render();
  if(keepFocus){const inp=document.querySelector(`form[data-col="${form.dataset.col}"] input[name="text"]`);if(inp)inp.focus()}
});
